name: Deploy backend to VPS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (pip install + pm2 restart)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e
            # pm2 may be installed via nvm, which non-interactive shells don't load
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"

            cd "${{ secrets.REMOTE_APP_DIR }}"
            git fetch origin main --prune
            git reset --hard origin/main

            cd backend
            # shared venv lives outside the repo: /var/www/invoyq.com/backend/venv
            . ../../backend/venv/bin/activate
            pip install -U pip
            pip install -r requirements.txt

            pm2 restart "${{ secrets.PM2_BACKEND_NAME }}" --update-env
            pm2 save
            echo "Backend deployed at $(git rev-parse --short HEAD)"
